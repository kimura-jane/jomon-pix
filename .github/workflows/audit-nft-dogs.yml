name: Audit TAF DOG artwork (read-only sources)

on:
  push:
    branches: ['main']
    paths:
      - 'scripts/audit_nft_dogs.py'
      - '.github/workflows/audit-nft-dogs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-nft-dogs
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout JOMON pix only
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<12"
      - name: Build source and sticker contact sheets
        run: python scripts/audit_nft_dogs.py
      - name: Commit audit previews to JOMON pix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/
          if git diff --cached --quiet; then
            echo "No changes in audit previews."
          else
            git commit -m "Add TAF DOG source and cutout quality audit previews"
            git push origin HEAD:main
          fi
