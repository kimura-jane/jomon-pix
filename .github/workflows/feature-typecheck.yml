name: JOMON PIX feature checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/test_hair_smart_erase.mjs'
      - 'scripts/test_eraser_portrait_layout.mjs'
      - '.github/workflows/feature-typecheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build website (no deploy)
        run: npm run build
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test hair overlays, smart erase, and Undo in Chromium
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/jomon-feature.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/test_hair_smart_erase.mjs
          node scripts/test_eraser_portrait_layout.mjs
