name: Align local AI runtime with IMG.LY peer (feature branch only)
on:
  push:
    branches: [feature/ai-inpainting-migan-20261119]
    paths: [.github/workflows/align-migan-runtime.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-inpainting-migan-20261119
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact IMG.LY peer and MI-GAN runtime
        run: |
          npm install --save-exact --no-audit --no-fund onnxruntime-web@1.21.0
          npm ci --no-audit --no-fund
      - name: Re-vendor WASM runtime to match the new version
        run: python3 scripts/vendor_migan.py
      - name: Commit corrected lock and browser runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json public/ai/inpaint
          git diff --cached --quiet || git commit -m 'Align AI runtime with IMG.LY onnxruntime-web 1.21 peer'
          git push origin HEAD:feature/ai-inpainting-migan-20261119
