name: Evaluate CC0 Commons dogu photos

on:
  push:
    branches: [main]
    paths:
      - scripts/evaluate_commons_dogu.py
      - .github/workflows/evaluate-commons-dogu.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commons-dogu-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install segmentation
        run: python -m pip install "rembg[cpu]>=2.0.65,<2.1" "Pillow>=10,<12" "requests>=2,<3"
      - name: Evaluate CC0 dogu sources
        run: python scripts/evaluate_commons_dogu.py
      - name: Commit previews only to JOMON pix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/realistic-candidates/dogu-d09.webp docs/audit/realistic-candidates/dogu-d10.webp docs/audit/realistic-commons-dogu-cutouts.jpg docs/audit/realistic-commons-dogu-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit two public-domain dogu photographs"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
