name: Evaluate alternative TAF DOG masks

on:
  push:
    branches: ['main']
    paths:
      - 'scripts/evaluate_dog_masks.py'
      - '.github/workflows/evaluate-dog-masks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluate-dog-masks
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out only JOMON pix
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-processing models
        run: python -m pip install "rembg[cpu]>=2.0.65,<2.1" "Pillow>=10,<12"
      - name: Evaluate original TAF DOG segmentation
        run: python scripts/evaluate_dog_masks.py
      - name: Commit comparison reports in JOMON pix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/
          if git diff --cached --quiet; then
            echo "No changes in previews."
          else
            git commit -m "Add alternate TAF DOG segmentation quality previews"
            git push origin HEAD:main
          fi
