name: Generate TAF DOG transparent stickers

on:
  push:
    branches: ['main']
    paths:
      - 'scripts/generate_nft_dogs.py'
      - '.github/workflows/generate-nft-dogs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-nft-dogs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out JOMON pix (only writable repository)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install background-removal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "rembg[cpu]>=2.0.65,<2.1" "Pillow>=10,<12"

      - name: Read TAF DOG source from inu and make transparent WebP
        run: python scripts/generate_nft_dogs.py

      - name: Commit generated stickers to JOMON pix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stickers/taf-dog/
          if git diff --cached --quiet; then
            echo "No new sticker assets to commit."
          else
            git commit -m "Add twenty transparent TAF DOG NFT sticker assets"
            git push origin HEAD:main
          fi
