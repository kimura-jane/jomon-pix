name: Test all 22 JOMON pix frame previews

on:
  push:
    branches: [main]
    paths:
      - 'src/components/Panel.tsx'
      - 'src/App.css'
      - 'scripts/audit_frame_previews.mjs'
      - '.github/workflows/audit-frame-previews.yml'
      - 'public/frame-previews/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test environment
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify TypeScript and production bundle
        run: |
          npm run typecheck
          npm run build
      - name: Check all frames on Chromium and iOS-like WebKit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/frame-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/audit_frame_previews.mjs chromium
          node scripts/audit_frame_previews.mjs webkit
      - name: Upload QA results without committing to main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-previews-qa
          path: docs/audit/frame-previews-*
          if-no-files-found: warn
