name: Publish photographed archaeology sticker assets

on:
  push:
    branches: [main]
    paths:
      - scripts/publish_archaeology_stickers.py
      - .github/workflows/publish-archaeology-stickers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-archaeology-stickers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight image processing dependencies
        run: python -m pip install "Pillow>=10,<12" "numpy>=1.26,<3"
      - name: Validate and publish 20 artifact stickers
        run: python scripts/publish_archaeology_stickers.py
      - name: Verify output counts
        run: |
          test "$(find public/stickers/archaeology/v1/haniwa -type f -name '*.webp' | wc -l)" -eq 10
          test "$(find public/stickers/archaeology/v1/dogu -type f -name '*.webp' | wc -l)" -eq 10
      - name: Commit versioned assets only to JOMON pix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stickers/archaeology/v1/ docs/audit/archaeology-final-*.jpg docs/audit/archaeology-sticker-source-manifest.json
          if git diff --cached --quiet; then
            echo "No new assets"
          else
            git commit -m "Add 20 authentic photographed archaeology sticker images"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
