name: Generate real frame reference images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_frame_previews.mjs'
      - '.github/workflows/generate-frame-previews.yml'
      - 'src/components/PhotoFrame.tsx'
      - 'src/components/SceneLayers.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jomon-pix-frame-previews
  cancel-in-progress: false

jobs:
  render-frame-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and Chromium test dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify source compiles
        run: npm run typecheck
      - name: Render reference images from the actual editor
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/jomon-frame-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/generate_frame_previews.mjs
          test "$(find public/frame-previews -name '*.png' | wc -l)" -eq 22
      - name: Commit all 22 previews to jomon-pix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frame-previews/
          if ! git diff --cached --quiet; then
            git commit -m "Add 22 accurate visual previews for borders, scenes and social frames"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
