name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify requested emoji stickers and no duplicate entries
        run: python3 scripts/test_emoji_stickers.py
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Block deployment on viewport zoom regressions
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/jomon-zoom-test.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/test_zoom_regression.mjs chromium
          node scripts/test_zoom_regression.mjs webkit
      - name: Save zoom regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoom-regression
          path: docs/audit/zoom-regression-*.json
          if-no-files-found: warn
      - name: Include local AI model for leg controls
        run: python3 scripts/fetch_pose_model.py --out dist/mediapipe/pose_landmarker_lite.task
      - name: Create installable PWABuilder assets and offline app shell
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 scripts/test_pwa.py
          python3 scripts/build_pwa.py --out dist
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy uploaded artifact
        id: deployment
        uses: actions/deploy-pages@v4
