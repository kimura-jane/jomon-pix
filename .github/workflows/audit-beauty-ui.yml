name: Verify on-device beauty with real portrait

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_beauty_ui.mjs
      - .github/workflows/audit-beauty-ui.yml
      - src/lib/beautyProcessor.ts
      - src/components/BeautyPanel.tsx
      - src/lib/makeupPresets.ts
      - scripts/audit_makeup_presets.mjs
      - src/components/useBeautyPreview.ts
  pull_request:
    paths:
      - scripts/audit_beauty_ui.mjs
      - .github/workflows/audit-beauty-ui.yml
      - src/lib/beautyProcessor.ts
      - src/components/BeautyPanel.tsx
      - src/lib/makeupPresets.ts
      - scripts/audit_makeup_presets.mjs
      - src/lib/autoFaceDeco.ts
      - src/components/useBeautyPreview.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and provision test browser
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Acquire official MediaPipe sample portrait for runtime test only
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://storage.googleapis.com/mediapipe-assets/portrait.jpg \
            --output /tmp/beauty-portrait.jpg
          test "$(wc -c </tmp/beauty-portrait.jpg)" -gt 10000
      - name: Build current application
        run: npm run typecheck && npm run build
      - name: Exercise beauty inference sliders and PNG export
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/beauty-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/audit_beauty_ui.mjs
          node scripts/audit_makeup_presets.mjs
      - name: Upload QA results without committing to main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beauty-chromium-qa
          path: docs/audit/beauty-smoke-results.json
          if-no-files-found: warn
