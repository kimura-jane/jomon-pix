name: Verify beauty in iPhone-like WebKit

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_beauty_webkit.mjs
      - .github/workflows/audit-beauty-webkit.yml
      - src/lib/beautyProcessor.ts
      - src/components/useBeautyPreview.ts
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and WebKit test browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Get official test portrait without committing the source
        run: |
          curl --fail --location --retry 3 --max-time 60 \
            https://storage.googleapis.com/mediapipe-assets/portrait.jpg \
            --output /tmp/beauty-portrait.jpg
      - name: Build website
        run: npm run typecheck && npm run build
      - name: Test face beauty in WebKit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/beauty-webkit-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/audit_beauty_webkit.mjs
      - name: Record successful compatibility result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/beauty-webkit-smoke.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify beauty in iPhone-like WebKit browser"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
