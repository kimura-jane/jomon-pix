name: JOMON PIX Android 1.1.1 native offline (manual)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode; must exceed every code already on Google Play"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: jomon-pix-android-native
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_KEYSTORE_PATH: /tmp/jomon-pix-upload.keystore
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Checkout JOMON PIX source only
        uses: actions/checkout@v4

      - name: Verify requested Play versionCode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          raw = os.environ["VERSION_CODE"]
          if not raw.isascii() or not raw.isdigit() or not 1 <= int(raw) <= 2100000000:
              raise SystemExit("versionCode must be an integer from 1 to 2100000000")
          PY

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21 for Capacitor 7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The retired Android SDK 'tools' package breaks setup-android@v3.
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked JOMON PIX dependencies
        run: npm ci --no-audit --no-fund

      # Capacitor Android is only needed for manually generated native builds.
      # Install the exact Capacitor 7.6.10 counterpart after npm ci, without
      # changing package.json or affecting iOS/Web dependency installations.
      - name: Install pinned Capacitor Android platform
        run: npm install --no-save --no-audit --no-fund @capacitor/android@7.6.10

      - name: Install offline asset verification tools
        run: python3 -m pip install --quiet Pillow==11.3.0

      - name: Verify requested emoji stickers and no duplicate entries
        run: python3 scripts/test_emoji_stickers.py

      - name: Verify six icon source sets and native bridge wiring
        run: python3 scripts/test_app_icon_switching.py

      - name: Test generated Android versions, icons and fail-closed rules
        run: python3 scripts/test_prepare_android_native.py

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Build locally hosted Android editing UI
        run: |
          set -euo pipefail
          python3 scripts/fetch_pose_model.py
          npm run build:native

      - name: Include every required offline AI model and Japanese font
        run: |
          set -euo pipefail
          python3 scripts/bundle_native_offline.py

      - name: Generate Capacitor Android native project
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android

      - name: Verify no offline asset is missing from native Android package
        run: |
          set -euo pipefail
          python3 scripts/bundle_native_offline.py \
            --out android/app/src/main/assets/public --verify-only
          python3 scripts/prepare_android_native.py --version-code "$VERSION_CODE"

      # Restore the key *after* npm, download and Capacitor preparation steps.
      # No third-party install hook can read GitHub Secrets from its environment.
      - name: Restore and validate existing upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/verify_android_upload_key.py --output "$ANDROID_KEYSTORE_PATH"

      - name: Build signed AAB for Google Play and signed APK for device testing
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify signed APK minSdk, targetSdk, identity and version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk > /tmp/jomon-android-badging.txt
          grep -F "sdkVersion:'24'" /tmp/jomon-android-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/jomon-android-badging.txt
          grep -F "package: name='com.jomonpix.app' versionCode='$VERSION_CODE' versionName='1.1.1'" /tmp/jomon-android-badging.txt
          unzip -t android/app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "Android Play SDK, package name and native release bundle validated."

      - name: Show separate AAB and APK sizes
        run: |
          du -h android/app/build/outputs/bundle/release/app-release.aab
          du -h android/app/build/outputs/apk/release/app-release.apk

      # Separate artifacts to avoid downloading the APK when only Google Play AAB is needed.
      - name: Upload signed AAB for Google Play (no automatic publication)
        uses: actions/upload-artifact@v4
        with:
          name: jomon-pix-android-AAB-1.1.1-code-${{ inputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed APK for optional device testing
        uses: actions/upload-artifact@v4
        with:
          name: jomon-pix-android-APK-1.1.1-code-${{ inputs.version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Erase temporary upload key
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
