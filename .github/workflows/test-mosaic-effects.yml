name: Test JOMON PIX mosaic styles and Home navigation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'src/lib/mosaicEffects.ts'
      - 'src/components/MosaicPanel.tsx'
      - 'src/components/TopBar.tsx'
      - 'src/lib/uiLanguage.ts'
      - 'src/App.css'
      - 'scripts/test_mosaic_effects.mjs'
      - '.github/workflows/test-mosaic-effects.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mosaic-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Typecheck and production build
        run: npm run typecheck && npm run build
      - name: Start preview server
        id: preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/jomon-mosaic.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null
      - name: Mosaic output and undo (Chromium)
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: node scripts/test_mosaic_effects.mjs
      - name: Mosaic output and undo (WebKit)
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: JOMON_BROWSER=webkit node scripts/test_mosaic_effects.mjs
      - name: Smart eraser portrait, zoom and stable coordinates
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: node scripts/test_eraser_portrait_layout.mjs
      - name: Hair replacement, AI inpainting, pixel output and undo
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: node scripts/test_hair_smart_erase.mjs
