name: Audit realistic haniwa and dogu museum art

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_museum_stickers.py
      - .github/workflows/audit-museum-stickers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: museum-stickers-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image audit dependencies
        run: python -m pip install "Pillow>=10,<12" "requests>=2,<3"
      - name: Check museum CC0 images
        run: python scripts/audit_museum_stickers.py
      - name: Commit visual audit artifacts to JOMON pix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/museum-*.json docs/audit/museum-*.jpg
          if git diff --cached --quiet; then
            echo "Museum audit unchanged"
          else
            git commit -m "Audit reusable museum artifact photos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
