name: Verify large artwork autosave on iPhone-like browsers

on:
  push:
    branches: [main]
    paths:
      - 'src/store.ts'
      - 'src/App.tsx'
      - 'src/components/TopBar.tsx'
      - 'scripts/audit_large_autosave.mjs'
      - '.github/workflows/audit-large-autosave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test environment
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Compile editor
        run: npm run typecheck && npm run build
      - name: Test heavy PNG and legacy migrations
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/jomon-autosave-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/jomon-pix/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/audit_large_autosave.mjs chromium
          node scripts/audit_large_autosave.mjs webkit
      - name: Upload autosave QA reports without changing main
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-autosave-qa
          path: docs/audit/large-autosave-*.json
          if-no-files-found: warn
