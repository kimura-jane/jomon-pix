# JOMON pix — iPhone first (Capacitor 7 + Vite + React).
# Manual build initiation only. Signed IPA builds upload to App Store Connect for internal TestFlight testing; no App Store review submission.
# Bundle ID com.jomonpix.app must be registered in Apple Developer first.
workflows:
  ios-simulator-check:
    name: "JOMON pix — iOS compile check (no signing)"
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: "22"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install app dependencies
        script: npm install --no-audit --no-fund
      - name: TypeScript check
        script: npm run typecheck
      - name: Prepare local iOS app and icon
        script: bash scripts/prepare-ios.sh
      - name: Install iOS pods
        script: |
          cd ios/App
          pod install
      - name: Build for iOS Simulator without Apple signing
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app"
      - "/tmp/xcodebuild_logs/*.log"

  ios-ipa:
    name: "JOMON pix — signed IPA + TestFlight upload (manual)"
    instance_type: mac_mini_m2
    max_build_duration: 120
    # IMPORTANT: Set this to the App Store Connect integration name
    # available in YOUR Codemagic Team settings (default here: Codemagic).
    integrations:
      app_store_connect: Codemagic
    environment:
      node: "22"
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jomonpix.app
    scripts:
      - name: Install app dependencies
        script: npm install --no-audit --no-fund
      - name: TypeScript check
        script: npm run typecheck
      - name: Prepare local iOS app and icon
        script: bash scripts/prepare-ios.sh
      - name: Install iOS pods
        script: |
          cd ios/App
          pod install
      - name: Apply Apple signing profiles from Codemagic
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project use-profiles
      - name: Set and verify numeric App Store build number
        script: |
          set -euo pipefail
          # BUILD_NUMBER is the documented Codemagic sequence number.
          # Do not use CM_BUILD_NUMBER: it previously produced CFBundleVersion=YES.
          : "${BUILD_NUMBER:?Codemagic BUILD_NUMBER is not defined}"
          python3 scripts/set_ios_build_number.py "$BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme App
      - name: Verify built IPA version before App Store Connect upload
        script: |
          set -euo pipefail
          python3 scripts/verify_ios_ipa_version.py
    artifacts:
      - "ios/App/build/ios/ipa/*.ipa"
      - "build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM"
    publishing:
      app_store_connect:
        # Authenticates with integrations.app_store_connect (reference name above).
        # Uploads the signed .ipa to App Store Connect, making it available
        # in TestFlight after Apple finishes processing the binary.
        auth: integration
        # Do not submit for EXTERNAL TestFlight beta review automatically.
        # Internal testers can be assigned in App Store Connect after processing.
        submit_to_testflight: false
        # Never submit the app to App Store review.
        submit_to_app_store: false
